spring:
  application:
    name: baseplus-backend
  profiles:
    default: dev
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:https://baseplus.local}
  audience: ${JWT_AUDIENCE:baseplus-api}
  clock-skew: ${JWT_CLOCK_SKEW:PT30S}
  legacy:
    accept-until: ${JWT_LEGACY_ACCEPT_UNTIL:2026-11-10T00:00:00Z}

server:
  port: 8080

baseplus:
  cors:
    allowed-origins: ${BASEPLUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    directory: ${UPLOAD_DIR:uploads}
